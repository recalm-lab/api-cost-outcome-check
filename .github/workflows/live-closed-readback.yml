name: Verify existing live closed Worker read only
on:
  push:
    tags: ['recalm-live-closed-readback-*']
permissions:
  contents: read
concurrency:
  group: recalm-existing-sandbox-worker
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'recalm-lab/api-cost-outcome-check' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a0f3dd3c81afb9f2cf5b775a7437a485f17d2e89
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate all synthetic tests before providing runtime credential
        run: npm test
      - name: GET-only live closed configuration, namespace, Secret names and types, exports and public health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/configure-live-closed.mjs 01e29255e421ede7f0e9999051d224fac92f4ac5 --verify
      # No upload, PATCH, Stripe credential retrieval or activation.
