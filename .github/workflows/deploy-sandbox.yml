name: Deploy approved sandbox Worker
on:
  push:
    tags:
      - 'recalm-sandbox-deploy-*'
permissions:
  contents: read
concurrency:
  group: recalm-existing-sandbox-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'recalm-lab/api-cost-outcome-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Verify reviewed code
        run: npm test
      - name: Build deterministic static assets
        run: npm run build:demo
      - name: Confirm generated assets match approved commit
        run: git diff --exit-code -- public
      - name: Validate exact existing Worker and closed flags
        run: node scripts/deploy-existing-worker.mjs dry-run
      - name: Deploy existing sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-existing-worker.mjs deploy
      - name: Read-only deployment smoke test
        run: node scripts/sandbox-smoke.mjs readiness
