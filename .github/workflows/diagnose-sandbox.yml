name: Diagnose existing Worker access
on:
  push:
    tags:
      - 'recalm-sandbox-diagnose-*'
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'recalm-lab/api-cost-outcome-check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read only selected Worker metadata status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-worker-access.mjs
