name: Deploy sandbox with scoped Worker API
on:
  push:
    tags:
      - 'recalm-sandbox-scoped-deploy-*'
permissions:
  contents: read
concurrency:
  group: recalm-existing-sandbox-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'recalm-lab/api-cost-outcome-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:demo
      - run: git diff --exit-code -- public
      - name: Compile same API and SQLite DO with inline static assets
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes --cache /tmp/recalm-npm-cache wrangler@4.149.0 deploy --dry-run --config wrangler.inline.jsonc --outdir /tmp/recalm-inline-build
      - name: Upload only existing Worker with retained secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/upload-existing-worker.mjs
      - name: Confirm three flags remain false
        run: node scripts/sandbox-smoke.mjs readiness
